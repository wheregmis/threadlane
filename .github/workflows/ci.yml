name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, clippy and fmt
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # GPUI (threadlane-desktop) needs these system libraries to build on Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev cmake libclang-dev \
            libfontconfig-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev libxcb-randr0-dev \
            libxcb-image0-dev libxcb-icccm4-dev libxcb-keysyms1-dev \
            libxcb-util-dev libvulkan-dev libasound2-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      # MBX object archives do not contain Cargo registry or Git downloads.
      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ci-registry-${{ runner.os }}
          cache-targets: false
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Cache compiler objects
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          version: '1.30.0'
          backend: github
          github-cache-mode: objects
          cache-generation: threadlane-ci-v1
          isolate-objects-cache: true
          clean-target-before-export: true
      - run: cargo fmt --all -- --check
      - run: mbx clippy --workspace --all-targets -- -D warnings
      - run: mbx test --workspace
