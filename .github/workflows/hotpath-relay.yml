name: hotpath relay

on:
  workflow_run:
    workflows: ["hotpath benchmark"] # the `name:` of the benchmark workflow
    types: [completed]

jobs:
  relay:
    strategy:
      fail-fast: false
      matrix:
        suite: [provider, dispatch]
    # Keep the tag in step with the `hotpath` version in Cargo.lock.
    uses: hotpath-rs/hotpath/.github/workflows/hotpath-relay.yml@f98dee237c49087e20b94b62bcd9becfceeee357 # v0.29.2
    permissions:
      actions: read # download the artifact of the benchmark run
      id-token: write # authenticate the upload
      pull-requests: read # find the pull request the run belongs to
    with:
      benchmark: ${{ matrix.suite }}
      artifact_name: hotpath-report-${{ matrix.suite }}
      report_file: report.json
