  macos:
    name: macOS Apple Silicon
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify release tag
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "threadlane-gpui") | .version')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match threadlane-gpui version v$version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: gpui-release-aarch64

      - name: Install packaging tools
        run: |
          brew install create-dmg
          cargo install --locked cargo-packager --version 0.11.8

      - name: Bundle with ad-hoc app signing
        env:
          THREADLANE_UPDATER_PUBLIC_KEY: ${{ vars.THREADLANE_UPDATER_PUBLIC_KEY }}
        run: |
          if [[ -z "$THREADLANE_UPDATER_PUBLIC_KEY" ]]; then
            echo "::error::Repository variable THREADLANE_UPDATER_PUBLIC_KEY is not configured"
            exit 1
          fi
          ./scripts/bundle-gpui-macos.sh

      - name: Sign updater archive
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" || -z "$CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD" ]]; then
            echo "::error::Updater signing secrets are not configured"
            exit 1
          fi
          tar -czf target/release/Threadlane.app.tar.gz -C target/release Threadlane.app
          cargo packager signer sign target/release/Threadlane.app.tar.gz

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-aarch64
          path: |
            target/release/Threadlane-*.dmg
            target/release/Threadlane-*.zip
            target/release/Threadlane.app.tar.gz
            target/release/Threadlane.app.tar.gz.sig
          if-no-files-found: error

  draft-release:
    name: Draft GitHub release
    needs: [macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate update manifest and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f artifacts/Threadlane.app.tar.gz
          test -f artifacts/Threadlane.app.tar.gz.sig
          test -n "$(find artifacts -maxdepth 1 -name 'Threadlane-*.dmg' -print -quit)"
          test -n "$(find artifacts -maxdepth 1 -name 'Threadlane-*.zip' -print -quit)"
          version="${RELEASE_TAG#v}"
          signature=$(cat artifacts/Threadlane.app.tar.gz.sig)
          notes=$(gh release view "$RELEASE_TAG" --json body --jq '.body' 2>/dev/null || printf 'Threadlane %s' "$RELEASE_TAG")
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Threadlane.app.tar.gz"
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --arg url "$url" \
            --arg signature "$signature" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"macos-aarch64": {url: $url, signature: $signature, format: "app"}}}' \
            > artifacts/latest.json
          jq -e '.version and .platforms["macos-aarch64"].url and .platforms["macos-aarch64"].signature' artifacts/latest.json
          sha256sum artifacts/* > artifacts/SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Threadlane ${{ env.RELEASE_TAG }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
