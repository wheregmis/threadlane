name: Release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag created by Release Please
        required: true
        type: string
    secrets:
      CARGO_PACKAGER_SIGN_PRIVATE_KEY:
        required: true
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD:
        required: true
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.release_tag || inputs.tag || github.ref_name }}

