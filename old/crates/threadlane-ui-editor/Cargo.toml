[package]
name = "threadlane-ui-editor"
version = "0.1.0"
edition = "2021"
description = "File editor view for the Threadlane desktop app: multi-tab editing with save/open status"

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
rfd.workspace = true
threadlane-ui-state.workspace = true
threadlane-ui-kit.workspace = true
threadlane-client.workspace = true
tracing.workspace = true
anyhow = "1"
lsp-types = "0.97"
serde_json.workspace = true
threadlane-protocol.workspace = true
url.workspace = true
percent-encoding = "2"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
threadlane-ui-state = { workspace = true, features = ["test-support"] }
