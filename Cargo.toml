[workspace]
members = ["crates/*"]
exclude = ["old"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
threadlane-backend-claude = { path = "crates/threadlane-backend-claude" }
threadlane-client = { path = "crates/threadlane-client" }
threadlane-core = { path = "crates/threadlane-core" }
threadlane-hub = { path = "crates/threadlane-hub" }
threadlane-mcp = { path = "crates/threadlane-mcp" }
threadlane-runner = { path = "crates/threadlane-runner" }
threadlane-store = { path = "crates/threadlane-store" }
threadlane-testkit = { path = "crates/threadlane-testkit" }
threadlane-transport-local = { path = "crates/threadlane-transport-local" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "process", "io-util", "net", "fs"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# Pinned per Plan.md §18.1: rerun the crash gate before every upgrade.
turso = { version = "=0.8.3", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
