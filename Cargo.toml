[workspace]
members = ["crates/*"]
exclude = ["old"]
resolver = "3"

[workspace.package]
version = "0.1.60"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
threadlane-backend-antigravity = { path = "crates/threadlane-backend-antigravity" }
threadlane-backend-claude = { path = "crates/threadlane-backend-claude" }
threadlane-backend-codex = { path = "crates/threadlane-backend-codex" }
threadlane-client = { path = "crates/threadlane-client" }
threadlane-core = { path = "crates/threadlane-core" }
threadlane-hub = { path = "crates/threadlane-hub" }
threadlane-mcp = { path = "crates/threadlane-mcp" }
threadlane-runner = { path = "crates/threadlane-runner" }
threadlane-store = { path = "crates/threadlane-store" }
threadlane-testkit = { path = "crates/threadlane-testkit" }
threadlane-transport-local = { path = "crates/threadlane-transport-local" }
threadlane-transport-iroh = { path = "crates/threadlane-transport-iroh" }
threadlane-updater = { path = "crates/threadlane-updater" }

anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "process", "io-util", "net", "fs"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# Pinned per Plan.md §18.1: rerun the crash gate before every upgrade.
turso = { version = "=0.8.4", default-features = false }
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = "3"
# Pinned: iroh's API changes between releases. No default features: no
# portmapper (it talks to the router) and no metrics; ring for TLS.
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
# Local discovery, which iroh keeps in this separate crate.
iroh-mdns-address-lookup = "=0.6.1"
# Pinned: the one time-zone dependency (docs/milestone-8.md §1 decision 2).
# The zone database is compiled in, so a routine fires at the same local time
# on every machine whatever its system zone files; nothing else is used.
jiff = { version = "=1.0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
# Pinned as old/Cargo.toml pins it; GPUI itself comes from the patch below.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "134ddaa0906fbfc688255b33daef0e803a039050" }

# Keep GPUI Kit's `gpui-pre` facades on the one gpui-fast snapshot it is
# tested against, as old/Cargo.toml does.
[patch.crates-io]
gpui-pre = { git = "https://github.com/longbridge/gpui-fast", rev = "5c31c703937ecc406b8bdd369c630e6afc31cb86" }
gpui-pre-platform = { git = "https://github.com/longbridge/gpui-fast", rev = "5c31c703937ecc406b8bdd369c630e6afc31cb86" }
gpui-pre-macros = { git = "https://github.com/longbridge/gpui-fast", rev = "5c31c703937ecc406b8bdd369c630e6afc31cb86" }
gpui-pre-sum-tree = { git = "https://github.com/longbridge/gpui-fast", rev = "5c31c703937ecc406b8bdd369c630e6afc31cb86" }
gpui-pre-web = { git = "https://github.com/longbridge/gpui-fast", rev = "5c31c703937ecc406b8bdd369c630e6afc31cb86" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
