[workspace]
members = [
    "crates/*",
    "extensions/*",
]
resolver = "2"

[workspace.package]
version = "0.1.16"
edition = "2021"

[workspace.dependencies]
# Internal workspace crates
threadlane-auth = { version = "0.1.0", path = "crates/threadlane-auth" }
threadlane-benchmarks = { version = "0.0.0", path = "crates/threadlane-benchmarks" }
threadlane-git = { version = "0.1.0", path = "crates/threadlane-git" }
threadlane-gpui = { version = "0.1.16", path = "crates/threadlane-gpui" }
threadlane-hashline = { version = "0.1.0", path = "crates/threadlane-hashline" }
threadlane-mcp = { version = "0.1.0", path = "crates/threadlane-mcp" }
threadlane-protocol = { version = "0.1.0", path = "crates/threadlane-protocol" }
threadlane-provider = { version = "0.1.0", path = "crates/threadlane-provider" }
threadlane-runtime = { version = "0.1.0", path = "crates/threadlane-runtime" }
threadlane-session = { version = "0.1.0", path = "crates/threadlane-session" }
threadlane-skills = { version = "0.1.0", path = "crates/threadlane-skills" }
threadlane-tools = { version = "0.1.0", path = "crates/threadlane-tools" }
threadlane-updater = { version = ">=0.1.0, <1.0.0", path = "crates/threadlane-updater" }
threadlane-wasi = { version = "0.1.0", path = "crates/threadlane-wasi" }

# External dependencies
async-trait = "0.1"
base64 = "0.22"
cargo-packager-updater = "=0.2.3"
directories = "6.0"
futures = "0.3"
gpui = { package = "gpui-pre", version = "0.3.3" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.3", features = ["font-kit"] }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit" }
gpui-component = { git = "https://github.com/longbridge/gpui-kit" }
gpui-kit-assets = { git = "https://github.com/longbridge/gpui-kit" }
hotpath = "0.25"
image = "0.25"
libsqlite3-sys = "0.38.2"
notify = "7.0"
portable-pty = "0.9"
regex = "1.10"
reqwest = { version = "0.12", default-features = false }
rfd = "0.17.2"
robius-open = { git = "https://github.com/project-robius/robius.git" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "2.0"
tokio = { version = "1.38", default-features = false }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
vt100 = "0.16"
wasmi = "2.0"

[profile.dev]
opt-level = 0
debug = true
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.dev.package."*"]
opt-level = 2

# wasmi 2.0 defaults to `auto-dispatch`: its build script selects the
# tail-call interpreter backend whenever the crate is compiled at opt-level 2
# or higher, on the assumption that LLVM turns every handler-to-handler
# `return handler(...)` into a sibling call. The dev profile's
# `debug-assertions = true` breaks that assumption: `core::ub_checks` inside
# the handlers take the address of a stack slot, so LLVM keeps a real call and
# every executed Wasm instruction nests one native frame. Loading any real
# extension then overflows GPUI's 512 KiB GCD worker stacks in ~6k
# instructions (SIGBUS at startup). Compiling wasmi without debug assertions
# restores the sibling calls its backend depends on; release builds already
# run this way. `threadlane-wasi` has a regression test for the stack bound.
[profile.dev.package.wasmi]
debug-assertions = false

[profile.dev.package.threadlane-gpui]
opt-level = 2

[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-pre-platform]
opt-level = 3

[profile.dev.package.gpui-pre-macros]
opt-level = 3

[profile.dev.package.gpui-component]
opt-level = 3

[profile.dev.package.gpui-kit]
opt-level = 3

[profile.dev.package.gpui-kit-assets]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
split-debuginfo = "packed"
strip = "none"
debug-assertions = false
overflow-checks = false
lto = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false
