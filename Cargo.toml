[workspace]
members = [
    "crates/*",
    "extensions/*",
]
resolver = "2"

[workspace.package]
version = "0.1.9"
edition = "2021"

[profile.dev]
opt-level = 0
debug = true
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.threadlane-gpui]
opt-level = 2

[profile.release]
opt-level = 3
debug = false
split-debuginfo = "packed"
strip = "none"
debug-assertions = false
overflow-checks = false
lto = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false
