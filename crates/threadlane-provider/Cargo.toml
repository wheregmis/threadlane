[package]
name = "threadlane-provider"
version = "0.1.0"
edition = "2021"
description = "OpenAI REST & Codex backend streaming client and device auth for threadlane agent"

[dependencies]
threadlane-protocol.workspace = true
threadlane-runtime.workspace = true
threadlane-auth.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true, features = ["default-tls", "json", "stream"] }
