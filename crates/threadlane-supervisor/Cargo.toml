[package]
name = "threadlane-supervisor"
version = "0.1.0"
edition = "2021"
description = "Background task supervisor for Threadlane: explicit /task runs over the coding-agent engine"

[dependencies]
threadlane-coding-agent.workspace = true
threadlane-project.workspace = true
threadlane-protocol.workspace = true
threadlane-runtime.workspace = true
threadlane-wasi.workspace = true
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json.workspace = true
log = "0.4"

[dev-dependencies]
tempfile.workspace = true
threadlane-provider.workspace = true
