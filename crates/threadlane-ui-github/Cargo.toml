[package]
name = "threadlane-ui-github"
version = "0.1.0"
edition = "2021"
description = "GitHub screen for the Threadlane desktop app: issues, pull requests, diffs, and review timelines"

[dependencies]
gpui.workspace = true
gpui-kit.workspace = true
gpui-component.workspace = true
rfd.workspace = true
serde_json.workspace = true
threadlane-coding-agent.workspace = true
threadlane-git.workspace = true
threadlane-protocol.workspace = true
threadlane-provider.workspace = true
threadlane-ui-catalog.workspace = true
threadlane-ui-state.workspace = true
threadlane-ui-theme.workspace = true
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
threadlane-ui-state = { workspace = true, features = ["test-support"] }
