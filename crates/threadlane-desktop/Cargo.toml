[package]
name = "threadlane-desktop"
description = "The thin desktop app: Home, the conversation with a project's lead, and answering decisions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# The hub's script: the app compares its own commit with the hub's.
build = "../threadlane-hub/build.rs"

[[bin]]
name = "threadlane-desktop"
path = "src/main.rs"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
jiff.workspace = true
image = { workspace = true, features = ["bmp", "tiff"] }
gpui-kit.workspace = true
semver = "1"
serde_json.workspace = true
threadlane-client.workspace = true
threadlane-core.workspace = true
threadlane-updater.workspace = true
tokio.workspace = true

[dev-dependencies]
async-trait.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
