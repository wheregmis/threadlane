[package]
name = "threadlane-store"
description = "The hub's durable stores on Turso, behind the threadlane-core interfaces"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
threadlane-core.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
turso.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }

[[bin]]
name = "threadlane-crash-writer"
path = "src/bin/crash_writer.rs"
test = false
doc = false

[lints]
workspace = true
