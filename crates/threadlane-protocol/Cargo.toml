[package]
name = "threadlane-protocol"
version = "0.1.0"
edition = "2021"
description = "Provider-neutral streaming and tool-call contracts for Threadlane"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["sync", "rt", "io-util", "net", "macros"] }
async-trait = "0.1"
