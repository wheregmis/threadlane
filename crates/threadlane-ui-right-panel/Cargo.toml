[package]
name = "threadlane-ui-right-panel"
version = "0.1.0"
edition = "2021"
description = "Right-side panel for the Threadlane desktop app: git review, draft PRs, browser, and file surfaces"

[dependencies]
base64.workspace = true
gpui.workspace = true
gpui-component.workspace = true
rfd.workspace = true
serde_json.workspace = true
threadlane-acp-engine.workspace = true
threadlane-client.workspace = true
threadlane-coding-agent.workspace = true
threadlane-git.workspace = true
threadlane-project.workspace = true
threadlane-protocol.workspace = true
threadlane-provider.workspace = true
threadlane-tools.workspace = true
threadlane-ui-kit.workspace = true
threadlane-ui-state.workspace = true
threadlane-ui-theme.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "0.53.3", package = "lb-wry" }
raw-window-handle = "0.6"
objc2 = { version = "0.6", features = ["std"] }
objc2-core-foundation = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
wry = { version = "0.53.3", package = "lb-wry" }
raw-window-handle = "0.6"
gtk = "0.18"
gdkx11 = "0.18"
webkit2gtk = "=2.0.1"
cairo-rs = { version = "0.22", features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
wry = { version = "0.53.3", package = "lb-wry" }
raw-window-handle = "0.6"
# Must stay on the same version lb-wry 0.53.3 uses (0.38): `WebViewExtWindows`
# returns wry's webview2-com types, so a mismatched version fails to compile.
webview2-com = "=0.38.2"
windows-core = "0.62"
image.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
threadlane-ui-state = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
