[package]
name = "threadlane-mcp"
version = "0.1.0"
edition = "2021"
description = "Model Context Protocol (MCP) client engine for threadlane agent"


[dependencies]
threadlane-runtime = { version = "0.1.0", path = "../threadlane-runtime" }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
futures = "0.3"

[dev-dependencies]
tempfile = "3.10"
