[package]
name = "threadlane-computer"
version = "0.1.0"
edition = "2021"
description = "Native computer-use tools for Threadlane: window introspection, screenshots, and input control"

[dependencies]
threadlane-protocol.workspace = true
threadlane-runtime.workspace = true
threadlane-wasi.workspace = true
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
async-trait.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["elcapitan", "highsierra"] }
core-foundation = "0.10"
image.workspace = true
