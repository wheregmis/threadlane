[package]
name = "threadlane-runtime"
version = "0.1.0"
edition = "2021"
description = "Threadlane agent runtime: harness, provider routing, tool dispatch, and composition"

[dependencies]
threadlane-protocol.workspace = true
threadlane-tools.workspace = true
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
futures.workspace = true
regex.workspace = true
thiserror.workspace = true
directories.workspace = true
tracing.workspace = true
sha2.workspace = true
libsqlite3-sys.workspace = true

[features]
default = []
needle = ["dep:needle-infer"]

[dependencies.needle-infer]
git = "https://github.com/Geekgineer/needle-rs"
optional = true

[dev-dependencies]
tempfile.workspace = true
threadlane-provider.workspace = true
