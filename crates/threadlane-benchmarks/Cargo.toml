[package]
name = "threadlane-benchmarks"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Centralized performance measurement harnesses for Threadlane"

[features]
default = []
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]

[dependencies]
hotpath.workspace = true
serde_json.workspace = true
tempfile.workspace = true
threadlane-mcp.workspace = true
threadlane-runtime.workspace = true
threadlane-tools.workspace = true
tokio = { workspace = true, features = ["full"] }
vt100.workspace = true
