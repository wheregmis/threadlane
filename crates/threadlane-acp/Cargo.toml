[package]
name = "threadlane-acp"
version = "0.1.0"
edition = "2021"
description = "Agent Client Protocol (ACP) stdio JSON-RPC client: protocol types, connection, and session management"
license = "MIT OR Apache-2.0"
repository = "https://github.com/threadlane/threadlane"
keywords = ["agent", "acp", "json-rpc", "subprocess"]
categories = ["asynchronous"]
rust-version = "1.95"

[dependencies]
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
tempfile.workspace = true
