[package]
name = "threadlane-session"
version = "0.1.0"
edition = "2021"
description = "Threadlane session management: CodingAgent, SessionConfig, subagents, skills, and ACP"

[features]
test-support = []

[dependencies]
threadlane-runtime = { version = "0.1.0", path = "../threadlane-runtime" }
threadlane-protocol = { version = "0.1.0", path = "../threadlane-protocol" }
threadlane-tools = { version = "0.1.0", path = "../threadlane-tools" }
threadlane-provider = { version = "0.1.0", path = "../threadlane-provider" }
threadlane-mcp = { version = "0.1.0", path = "../threadlane-mcp" }
threadlane-skills = { version = "0.1.0", path = "../threadlane-skills" }
threadlane-wasi = { version = "0.1.0", path = "../threadlane-wasi" }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
async-trait = "0.1"
futures = "0.3"
md5 = "0.7"
sha2 = "0.11"
thiserror = "2.0"
directories = "6.0"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

[dev-dependencies]
tempfile = "3.10"