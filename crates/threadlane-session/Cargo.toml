[package]
name = "threadlane-session"
version = "0.1.0"
edition = "2021"
description = "Threadlane session management: CodingAgent, SessionConfig, subagents, skills, and ACP"
# The only binary here is a test fixture, declared explicitly below so it is
# not built into ordinary workspace builds.
autobins = false

# A stand-in ACP agent for `tests/acp_engine_tests.rs`. The ACP client spawns a
# real subprocess, so covering it needs something real to spawn.
[[bin]]
name = "acp_stub_agent"
path = "src/bin/acp_stub_agent.rs"
required-features = ["test-support"]

[features]
test-support = []

[dependencies]
threadlane-acp.workspace = true
threadlane-runtime.workspace = true
threadlane-protocol.workspace = true
threadlane-auth.workspace = true
threadlane-tools.workspace = true
threadlane-provider.workspace = true
threadlane-mcp.workspace = true
threadlane-skills.workspace = true
threadlane-wasi.workspace = true
threadlane-git.workspace = true
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
async-trait.workspace = true
futures.workspace = true
sha2.workspace = true
thiserror.workspace = true
directories.workspace = true
log = "0.4"
reqwest = { workspace = true, features = ["rustls-tls", "stream"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["elcapitan", "highsierra"] }
core-foundation = "0.10"
image.workspace = true
