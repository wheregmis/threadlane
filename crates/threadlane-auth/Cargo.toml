[package]
name = "threadlane-auth"
version = "0.1.0"
edition = "2021"
description = "Authentication and credential storage primitives (OpenAI Device Code and Google OAuth PKCE) for Threadlane"

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["default-tls", "json"] }
tokio = { workspace = true, features = ["full"] }
url.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom = "0.4"
