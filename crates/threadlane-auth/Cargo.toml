[package]
name = "threadlane-auth"
version = "0.1.0"
edition = "2021"
description = "Authentication and credential storage primitives (OpenAI Device Code and Google OAuth PKCE) for Threadlane"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.38", features = ["full"] }
url = "2.5"
sha2 = "0.11"
base64 = "0.22"
getrandom = "0.4"
