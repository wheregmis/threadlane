[package]
name = "threadlane-coding-agent"
version = "0.1.0"
edition = "2021"
description = "Coding agent engine for Threadlane: CodingAgent runtime, durable harness, subagents, supervisor controller, and session support modules"

[dependencies]
async-trait.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["rustls-tls", "stream"] }
threadlane-acp.workspace = true
threadlane-acp-engine.workspace = true
threadlane-auth.workspace = true
threadlane-browser.workspace = true
threadlane-computer.workspace = true
threadlane-git.workspace = true
threadlane-mcp.workspace = true
threadlane-permission.workspace = true
threadlane-project.workspace = true
threadlane-prompt.workspace = true
threadlane-protocol.workspace = true
threadlane-provider.workspace = true
threadlane-question.workspace = true
threadlane-runtime.workspace = true
threadlane-skills.workspace = true
threadlane-tools.workspace = true
threadlane-wasi.workspace = true
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
log = "0.4"
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
