[package]
name = "threadlane-gpui"
version.workspace = true
edition.workspace = true
description = "GPUI Desktop application for Threadlane using gpui-component"

[features]
gpui-profiler = ["gpui/profiler"]
# Tests written against the pre-harness-v2 protocol schema. Keep opt-in while migrating them.
legacy-api-tests = []
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]

[dependencies]
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = ["tree-sitter-rust", "tree-sitter-python", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-html", "tree-sitter-css", "tree-sitter-bash", "tree-sitter-toml", "tree-sitter-yaml", "tree-sitter-markdown", "tree-sitter-diff"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
threadlane-protocol = { version = "0.1.0", path = "../threadlane-protocol" }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.17.2"
robius-open = { git = "https://github.com/project-robius/robius.git" }
dirs = "6.0"
anyhow = "1.0"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
portable-pty = "0.9"
vt100 = "0.16"
# notify is kept only for the re-export in watcher.rs (notify::Error); the actual
# watcher implementation now lives in the daemon. This dep will be removed once all
# watcher.rs call-sites are updated to use the daemon notification API.
notify = "8.2"
hotpath = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
# GPUI does not select a Linux window-system backend by default. Enable both
# native backends so a single Linux build works under Wayland and X11.
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"] }

[dev-dependencies]
async-trait = "0.1"
threadlane-provider = { version = "0.1.0", path = "../threadlane-provider" }
tempfile = "3.8"
threadlane-protocol = { version = "0.1.0", path = "../threadlane-protocol" }

