[package]
name = "threadlane-gpui"
version.workspace = true
edition.workspace = true
description = "GPUI Desktop application binary for Threadlane (thin shell over the threadlane-ui-* crates)"

[features]
gpui-profiler = ["gpui/profiler"]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
gpui_platform.workspace = true
threadlane-coding-agent.workspace = true
threadlane-ui-chat.workspace = true
threadlane-ui-theme.workspace = true
threadlane-ui-workspace.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hotpath.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# GPUI does not select a Linux window-system backend by default. Enable both
# native backends so a single Linux build works under Wayland and X11.
gpui_platform = { package = "gpui-pre-platform", version = "0.3.3", features = ["font-kit", "wayland", "x11"] }
