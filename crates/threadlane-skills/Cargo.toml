[package]
name = "threadlane-skills"
version = "0.1.0"
edition = "2021"
description = "Skill directory scanning, YAML frontmatter parsing, and load_skill tool for threadlane agent"

[dependencies]
threadlane-runtime = { version = "0.1.0", path = "../threadlane-runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.10"
