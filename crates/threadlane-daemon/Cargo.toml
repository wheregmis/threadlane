[package]
name = "threadlane-daemon"
version.workspace = true
edition.workspace = true
description = "Headless execution daemon for Threadlane supporting RPC over UDS and WebSockets"

[dependencies]
threadlane-protocol = { version = "0.1.0", path = "../threadlane-protocol" }
threadlane-session = { version = "0.1.0", path = "../threadlane-session" }
threadlane-runtime = { version = "0.1.0", path = "../threadlane-runtime" }
threadlane-tools = { version = "0.1.0", path = "../threadlane-tools" }
threadlane-git = { version = "0.1.0", path = "../threadlane-git" }
threadlane-auth = { version = "0.1.0", path = "../threadlane-auth" }
threadlane-skills = { version = "0.1.0", path = "../threadlane-skills" }
threadlane-wasi = { version = "0.1.0", path = "../threadlane-wasi" }
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
portable-pty = "0.9"
dirs = "6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.8"
